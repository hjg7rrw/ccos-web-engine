<!doctype html><html lang="en"><meta charset="utf-8">
<title>CCOS Local WebGL2 Diagnostic</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:16px system-ui;background:#071723;color:#c9eded;padding:2rem}canvas{border:2px solid #3bb7ae;width:192px;height:192px}pre{white-space:pre-wrap}</style>
<h1>CCOS WebGL2 Browser Probe</h1><p>Trusted local-only fixture. No external network requests or packages.</p>
<canvas width="128" height="128" id="c"></canvas><pre id="out" aria-live="polite">Testing…</pre>
<script>
const result={webgl2:false,draw_verified:false};
try{
 const gl=document.querySelector('canvas').getContext('webgl2',{preserveDrawingBuffer:true});
 if(!gl)throw Error("webgl2 context returned null");
 result.webgl2=true;result.version=gl.getParameter(gl.VERSION);
 const ext=gl.getExtension('WEBGL_debug_renderer_info');
 result.renderer=ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):'not exposed';
 const compile=(type,s)=>{
   let o=gl.createShader(type);gl.shaderSource(o,s);gl.compileShader(o);
   if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(o));
   return o;
 };
 const vs=compile(gl.VERTEX_SHADER,'#version 300 es\nvoid main(){vec2 p[3]=vec2[3](vec2(-1.,-1.),vec2(3.,-1.),vec2(-1.,3.));gl_Position=vec4(p[gl_VertexID],0.,1.);}');
 const fs=compile(gl.FRAGMENT_SHADER,'#version 300 es\nprecision highp float;out vec4 color;void main(){color=vec4(.16,.73,.46,1.);}');
 const prog=gl.createProgram();gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);
 if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));
 gl.useProgram(prog);gl.bindVertexArray(gl.createVertexArray());
 gl.viewport(0,0,128,128);gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();
 const pix=new Uint8Array(4);gl.readPixels(64,64,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pix);
 result.pixel=Array.from(pix);result.gl_error=gl.getError();
 result.draw_verified=result.gl_error===0&&pix[1]>110&&pix[3]===255;
}catch(e){result.error=String(e)}
document.querySelector('#out').textContent=JSON.stringify(result,null,2);
</script></html>
