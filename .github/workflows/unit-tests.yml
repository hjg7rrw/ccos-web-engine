name: CCOS deterministic source checks
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: JS geometry and projection tests
        run: node --test tests/math.test.mjs
      - name: New-site generator regression
        run: python tests/test_scaffold.py
      - name: Historical publisher negative controls
        run: python tests/test_publish_gate.py
      - name: Python source compile
        run: python -m compileall -q lab ops scripts tests
